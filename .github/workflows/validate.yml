name: contract-validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - run: python tools/validate_contract.py --schema schemas/manifest.schema.json --input examples/manifest.example.json
      - run: python tools/validate_contract.py --schema schemas/metrics.schema.json --input examples/metrics.example.json
      - run: python tools/validate_contract.py --schema schemas/expected_metrics.schema.json --input examples/expected_metrics.example.json
